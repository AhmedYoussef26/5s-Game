<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The World's Worst Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a workshop floor. The desk is the stage on the left; the facilitator panel and scoreboard sit on the right and stack below it on narrow screens. Single committed dark "shop floor" look. */
:root{
  --floor:#1d2225; --panel:#283036; --panel2:#313a41; --ink:#eeece6; --muted:#a9b0b5; --line:#434d55;
  --yellow:#f2c230; --red:#d9442f; --green:#62c476; --wood:#b4855a; --wood-dark:#8f6440; --tape:#151618;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--floor);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1380px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:6px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--tape) 12px 24px) 6}
.kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.title{font-family:var(--display);font-weight:900;font-size:clamp(2.1rem,5vw,3.6rem);line-height:.9;text-transform:uppercase;margin:0;text-wrap:balance}
.rail{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.rail li{font-size:.8rem;padding:3px 10px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.rail li b{font-family:var(--mono);font-weight:700;margin-right:4px}
.rail li.done{color:var(--ink);border-color:var(--green)}
.rail li.now{background:var(--yellow);border-color:var(--yellow);color:var(--tape);font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;margin-top:18px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}

/* desk */
.desk{position:relative;width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:
    repeating-linear-gradient(90deg,rgba(60,35,15,.07) 0 2px,transparent 2px 11px),
    repeating-linear-gradient(90deg,rgba(255,240,220,.05) 0 1px,transparent 1px 37px),
    linear-gradient(175deg,#bf9064,var(--wood) 55%,#a6774d);
  box-shadow:inset 0 0 0 7px var(--wood-dark),0 20px 44px rgba(0,0,0,.5)}
.layer{position:absolute;inset:0;width:100%;height:100%}
#zones{z-index:0}
#items{z-index:1;pointer-events:none}
#hazards{z-index:2;pointer-events:none}
#grime{z-index:3;pointer-events:none}
.desk[data-mode="shine"] #grime{pointer-events:auto;cursor:crosshair}
.zone{cursor:default}
.desk[data-mode="order"] .zone{cursor:pointer}
.item{position:absolute;pointer-events:auto;cursor:grab;filter:drop-shadow(0 2px 2px rgba(30,15,5,.45))}
.desk[data-mode="idle"] .item,.desk[data-mode="shine"] .item{cursor:default}
.item svg{display:block;width:100%;height:100%;overflow:visible}
.item.animate{transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1)}
.item.dragging{cursor:grabbing;filter:drop-shadow(0 10px 8px rgba(30,15,5,.45))}
.item:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.item.sel{outline:3px dashed var(--yellow);outline-offset:4px}
.item.found{outline:4px solid var(--yellow);outline-offset:6px;border-radius:6px;animation:ping 1s ease-in-out infinite}
.item.shake{animation:shake .32s}
.item.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.item .tag{position:absolute;left:50%;top:50%;translate:-50% -50%;font:700 10px/1 var(--mono);letter-spacing:.08em;background:var(--red);color:#fff;padding:4px 6px;border-radius:2px;white-space:nowrap;opacity:0;pointer-events:none}
.item.tagged .tag{opacity:1}
.item.gone{opacity:0;scale:.3;transition:opacity .4s,scale .4s}
@keyframes ping{50%{outline-offset:12px}}
@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}
@keyframes pop{from{scale:1.7;opacity:0}to{scale:1;opacity:1}}
.timer{position:absolute;z-index:4;top:14px;right:14px;font:700 clamp(1.2rem,3.4vw,2.2rem)/1 var(--mono);background:var(--tape);color:var(--yellow);padding:8px 12px;border-radius:4px;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.timer.late{color:var(--red)}
.toast{position:absolute;z-index:6;left:50%;bottom:14px;translate:-50% 8px;max-width:calc(100% - 32px);background:rgba(18,20,22,.94);color:var(--ink);padding:8px 14px;border-radius:4px;font-size:.95rem;opacity:0;transition:opacity .2s,translate .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1;translate:-50% 0}
.overlay{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:16px;background:rgba(22,25,27,.72);backdrop-filter:blur(2px)}
.overlay .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:clamp(16px,3vw,28px);max-width:440px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.overlay h3{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(1.6rem,4vw,2.5rem);line-height:.95;margin:0;text-wrap:balance}
.overlay p{margin:0;color:var(--muted)}
.strip{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin:10px 2px 0;min-height:1.5em}
.strip b{color:var(--ink)}

/* panel */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;color:var(--yellow);margin:0}
.panel h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2.4rem;line-height:.92;margin:0;text-wrap:balance}
.panel .body p{margin:0 0 8px}.panel .body p:last-child{margin:0}
.panel ul{margin:0;padding-left:20px}
.big-q{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.05;margin:0;text-wrap:balance}
.stat{display:flex;align-items:baseline;gap:10px;font-family:var(--mono)}
.stat .n{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .of{color:var(--muted);font-size:.9rem}
.meter{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:700 1rem/1.2 var(--body);background:var(--yellow);color:var(--tape);border:0;border-radius:5px;padding:11px 16px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ask{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;background:var(--panel2)}
.ask-label{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ask p{margin:0}
.result{font-family:var(--mono);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:6px}
.finds{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.finds li{padding:8px 10px;border-radius:5px;background:var(--panel2);font-size:.92rem}
.finds li.hit{border:1px solid var(--yellow)}
.finds li b{display:block}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:400 .95rem/1.35 var(--body);text-align:left;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:9px 12px 9px 36px;cursor:pointer;position:relative}
.opt::before{content:"";position:absolute;left:11px;top:11px;width:14px;height:14px;border:2px solid var(--muted);border-radius:3px}
.opt[aria-pressed="true"]{border-color:var(--yellow)}
.opt[aria-pressed="true"]::before{background:var(--yellow);border-color:var(--yellow)}
.opt .pill{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}
.opt .why{display:block;font-size:.85rem;margin-top:4px}
.opt.good .why{color:var(--green)}.opt.bad .why{color:#f08a7a}
.poster{background:#f4f1e8;color:#1b1b1b;border-radius:4px;padding:14px 16px;font-size:.92rem}
.poster h3{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.4rem;margin:0 0 6px;line-height:1}
.poster ol{margin:0;padding-left:20px}
.poster .sig{font-family:var(--mono);font-size:.72rem;color:#555;margin-top:8px}
.simlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.simlog li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px}
.simlog b{font-family:var(--mono);color:var(--yellow)}
.chart text{font-family:var(--mono);fill:var(--muted)}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pillar{background:var(--panel2);border-radius:5px;padding:10px;border:1px solid var(--line)}
.pillar b{display:block;font-family:var(--display);font-size:1.25rem;text-transform:uppercase;line-height:1}
.pillar span{font-size:.82rem;color:var(--muted)}
.pillar.on{border-color:var(--green)}
.pillar .st{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red);display:block;margin-top:4px}
.pillar.on .st{color:var(--green)}
.board{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:.86rem}
.row .bar{height:12px;background:var(--panel2);border-radius:3px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--yellow);transition:width .6s}
.row .bar i.miss{background:var(--red)}
.row .rv{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 62px;gap:10px;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.axis span:nth-child(2){display:flex;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="kicker">5S workplace organization · classroom game</p>
      <h1 class="title">The World's Worst Desk</h1>
    </div>
    <ol class="rail" id="rail" aria-label="Rounds"></ol>
  </header>

  <div class="layout">
    <section aria-label="The desk">
      <div class="desk" id="desk" data-mode="idle">
        <svg id="zones" class="layer" viewBox="0 0 1000 625" preserveAspectRatio="none"></svg>
        <div id="items" class="layer"></div>
        <svg id="hazards" class="layer" viewBox="0 0 1000 625" preserveAspectRatio="none" aria-hidden="true"></svg>
        <canvas id="grime" class="layer" width="1000" height="625" aria-label="Dirt on the desk"></canvas>
        <div id="timer" class="timer" hidden>0.0</div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="overlay" class="overlay" hidden><div class="card" id="overlayCard"></div></div>
      </div>
      <p class="strip" id="nameStrip"></p>
    </section>
    <aside class="side">
      <div class="panel" id="panel" aria-live="polite"></div>
      <div class="board" id="board"></div>
    </aside>
  </div>
</div>

<script>
const W=1000,H=625;
const $=s=>document.querySelector(s);
const desk=$('#desk'),itemsLayer=$('#items'),zonesSvg=$('#zones'),hazSvg=$('#hazards'),grime=$('#grime'),
      overlay=$('#overlay'),overlayCard=$('#overlayCard'),toastEl=$('#toast'),timerEl=$('#timer'),nameStrip=$('#nameStrip');
const gctx=grime.getContext('2d',{willReadFrequently:true});
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- item drawings (viewBox = item size in desk units) ---------- */
const SPECS={marker:[110,22],pen:[100,10],pencil:[96,11],stub:[34,11],notebook:[120,160],textbook:[120,165],paper:[130,160],
  crumple:[42,38],wrapper:[52,24],receipt:[40,84],bottle:[40,120],crushed:[38,100],cup:[62,62],banana:[72,58],duck:[56,50],
  cable:[150,60],tangle:[130,72],stapler:[110,34]};
const D={
  marker:i=>`<rect x="1" y="3" width="84" height="16" rx="4" fill="${i.color}" stroke="rgba(0,0,0,.45)"/>
    <rect x="18" y="3" width="36" height="16" fill="#e9e6df"/><rect x="22" y="7.5" width="28" height="2.5" fill="${i.color}"/><rect x="22" y="12" width="18" height="2.5" fill="${i.color}"/>`+
    (i.dried?`<path d="M85 6 L104 9.5 L104 12.5 L85 16Z" fill="#7d7a74"/><path d="M62 4 L67 11 L63 18" stroke="#9a968e" fill="none" stroke-width="1.2"/>`
            :`<rect x="80" y="1" width="29" height="20" rx="4" fill="${i.color}" stroke="rgba(0,0,0,.45)"/><rect x="83" y="3" width="23" height="4" rx="2" fill="#fff" opacity=".18"/>`),
  pen:i=>i.broken
    ?`<path d="M0 1 H40 L44 4 L40 9 H0Z" fill="${i.color}"/><path d="M52 1 L56 5 L52 9 H84 V1Z" fill="${i.color}"/><path d="M84 1 L98 5 L84 9Z" fill="#c9c4b8"/>`
    :`<rect x="0" y="1" width="84" height="8" rx="3" fill="${i.color}"/><path d="M84 1 L98 5 L84 9Z" fill="#c9c4b8"/><rect x="10" y="0" width="24" height="3" rx="1" fill="#8d8d8d"/>`,
  pencil:()=>`<rect x="10" y="1" width="72" height="9" fill="#f0b429"/><rect x="10" y="4.5" width="72" height="1.4" fill="#cf9119"/><rect x="0" y="1" width="9" height="9" rx="2" fill="#e88a9a"/><rect x="8" y="1" width="3" height="9" fill="#b9b9b9"/><path d="M82 1 L94 5.5 L82 10Z" fill="#e8c9a0"/><path d="M90 4 L96 5.5 L90 7Z" fill="#333"/>`,
  stub:()=>`<path d="M0 1 L3 3 L0 5 L3 7 L0 10 H22 V1Z" fill="#f0b429"/><path d="M22 1 L32 5.5 L22 10Z" fill="#e8c9a0"/><path d="M29 4 L33 5.5 L29 7Z" fill="#333"/>`,
  notebook:i=>`<rect x="6" y="0" width="114" height="160" rx="4" fill="${i.color}"/><rect x="34" y="22" width="66" height="26" rx="2" fill="#f4f1ea"/><rect x="40" y="30" width="44" height="3" fill="#888"/><rect x="40" y="38" width="30" height="3" fill="#aaa"/>`+
    Array.from({length:10},(_,k)=>`<circle cx="7" cy="${12+k*15}" r="4.5" fill="none" stroke="#d9d6cf" stroke-width="2"/>`).join(''),
  textbook:i=>`<rect width="120" height="165" rx="3" fill="${i.color}"/><rect width="13" height="165" fill="rgba(0,0,0,.25)"/><rect x="26" y="24" width="78" height="11" fill="#f4f1ea"/><rect x="26" y="41" width="52" height="6" fill="#f4f1ea" opacity=".7"/><circle cx="66" cy="108" r="27" fill="none" stroke="#f4f1ea" stroke-width="4" opacity=".55"/><path d="M48 108 H84 M66 90 V126" stroke="#f4f1ea" stroke-width="3" opacity=".55"/>`,
  paper:i=>`<rect width="130" height="160" fill="#fbfaf6" stroke="#d6d2c8"/><rect x="12" y="13" width="72" height="8" fill="#8f9ba5"/>`+
    [96,104,88,100,70,104,92,60,98,84].map((w,k)=>`<rect x="12" y="${32+k*12}" width="${w}" height="2.5" fill="#c9cdd2"/>`).join(''),
  crumple:()=>`<path d="M4 12 L12 3 L22 7 L31 2 L39 11 L36 21 L41 29 L30 36 L19 32 L9 37 L2 27 L7 19Z" fill="#efede6" stroke="#bdb8ad"/><path d="M12 3 L18 18 L30 36 M31 2 L22 18 L2 27 M39 11 L18 18" stroke="#c9c4b9" fill="none"/>`,
  wrapper:i=>`<rect x="8" y="3" width="36" height="18" rx="3" fill="${i.color}"/><path d="M8 3 L0 0 L3 12 L0 24 L8 21Z M44 3 L52 0 L49 12 L52 24 L44 21Z" fill="${i.color}"/><rect x="14" y="7" width="22" height="4" rx="2" fill="#fff" opacity=".45"/>`,
  receipt:()=>`<path d="M0 0 H40 V78 L35 84 L30 78 L25 84 L20 78 L15 84 L10 78 L5 84 L0 78Z" fill="#f6f3ea" stroke="#cfc9bc"/>`+
    [24,30,18,28,22,30,14].map((w,k)=>`<rect x="5" y="${8+k*9}" width="${w}" height="2.5" fill="#b7b2a7"/>`).join(''),
  bottle:()=>`<rect x="12" y="0" width="16" height="12" rx="2" fill="#2f6fd6"/><path d="M10 12 Q4 22 4 32 V112 Q4 120 12 120 H28 Q36 120 36 112 V32 Q36 22 30 12Z" fill="rgba(170,212,242,.8)" stroke="#6d9cc5"/><rect x="4" y="52" width="32" height="30" fill="#2f6fd6" opacity=".85"/><rect x="9" y="30" width="4" height="70" rx="2" fill="#fff" opacity=".35"/>`,
  crushed:i=>`<rect x="13" y="0" width="12" height="10" rx="2" fill="${i.color}"/><path d="M10 10 L4 24 L9 40 L3 58 L8 76 L4 98 H34 L30 78 L35 60 L29 42 L34 24 L28 10Z" fill="rgba(222,232,238,.6)" stroke="#9fb0ba"/><path d="M4 50 L34 46 M5 70 L33 73" stroke="#9fb0ba"/>`,
  cup:()=>`<circle cx="31" cy="31" r="29" fill="#f2efe8" stroke="#c9c2b4" stroke-width="2"/><circle cx="31" cy="31" r="22" fill="#5a3a22"/><circle cx="25" cy="25" r="6" fill="#7a5235" opacity=".7"/>`,
  banana:()=>`<path d="M6 10 Q20 52 66 48 Q70 44 64 42 Q28 40 14 6Z" fill="#f2cf3c" stroke="#a8862a"/><path d="M6 10 L1 3 L11 6Z" fill="#5a4320"/><path d="M16 30 Q8 46 0 52 Q16 47 24 37Z" fill="#e3b92f" stroke="#a8862a"/><circle cx="40" cy="40" r="2" fill="#8a6a22"/><circle cx="30" cy="30" r="1.6" fill="#8a6a22"/>`,
  duck:()=>`<ellipse cx="25" cy="32" rx="24" ry="16" fill="#f7d33a"/><path d="M8 28 Q20 40 34 30" stroke="#e0b523" stroke-width="2" fill="none"/><circle cx="40" cy="16" r="12" fill="#f7d33a"/><path d="M50 13 L58 17 L50 21Z" fill="#f08a24"/><circle cx="43" cy="13" r="2" fill="#222"/>`,
  cable:()=>`<path d="M10 30 C 30 2, 52 58, 75 30 S 116 4, 132 30" stroke="#f2f0ea" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="128" y="21" width="20" height="18" rx="3" fill="#e9e6df" stroke="#8a8a8a"/><rect x="0" y="24" width="12" height="12" rx="2" fill="#5a5a5a"/>`,
  tangle:()=>`<path d="M5 40 C20 0, 40 70, 55 30 S 90 -4, 80 40 S 40 70, 70 55 S 118 12, 122 35" stroke="#1d1e20" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M20 60 C 40 40, 60 72, 92 60" stroke="#1d1e20" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="117" y="28" width="11" height="14" rx="2" fill="#333"/>`,
  stapler:()=>`<rect x="0" y="4" width="110" height="26" rx="11" fill="#2a2c30"/><rect x="6" y="8" width="96" height="15" rx="7" fill="#c23b2e"/><rect x="12" y="10" width="60" height="3" rx="1.5" fill="#fff" opacity=".25"/>`
};

/* ---------- the desk's contents ---------- */
const NEEDED=[
  {kind:'marker',name:'Black marker',color:'#151618',zone:'slot0',home:[250,74,0],target:true},
  {kind:'marker',name:'Blue marker',color:'#1f4fb8',zone:'slot1',home:[250,112,0]},
  {kind:'marker',name:'Red marker',color:'#c0392b',zone:'slot2',home:[250,150,0]},
  {kind:'marker',name:'Green marker',color:'#1e8a4c',zone:'slot3',home:[250,188,0]},
  {kind:'pen',name:'Blue pen',color:'#2a55c9',zone:'pens',home:[392,128,90]},
  {kind:'pen',name:'Black pen',color:'#1b1c1e',zone:'pens',home:[420,128,90]},

function onClick(it){
  if(mode==='search'){
    if(it.target)endSearch(true);

  }else if(mode==='sort'){
    if(it.needed){shake(it);toast(`Keep it. The ${it.name.toLowerCase()} gets used in class.`)}
    else tagItem(it);

/* ---------- timed search ---------- */
function searchRound(key,onDone){
  setMode('idle');clearFound();
  showOverlay(`<p class="eyebrow">Timed search · 60 seconds</p><h3>Find the black marker</h3><p>Drag things aside if you need to. Click the marker the moment you see it. Some markers look black but are not.</p>`,
    [['Start the clock',()=>{hideOverlay();begin()}]]);
  function begin(){
    setMode('search');const t0=performance.now();
    timerEl.hidden=false;timerEl.classList.remove('late');
    searchState={key,t0,onDone,done:false};
    const tick=()=>{if(searchState.done)return;const t=(performance.now()-t0)/1000;timerEl.textContent=t.toFixed(1);timerEl.classList.toggle('late',t>45);if(t>=60){endSearch(false);return}timerRAF=requestAnimationFrame(tick)};
    tick();
  }
}
function endSearch(ok){
  const s=searchState;if(!s||s.done)return;s.done=true;cancelAnimationFrame(timerRAF);
  const t=ok?Math.min(60,(performance.now()-s.t0)/1000):60;
  timerEl.textContent=t.toFixed(1);setMode('idle');
  times[s.key]={t,ok};renderBoard();
  const tg=items.find(i=>i.target);if(tg){tg.z=++zTop;place(tg);tg.el.classList.add('found')}
  toast(ok?`Found it in ${t.toFixed(1)} seconds.`:'Time is up. It was here all along.');
  s.onDone(t,ok);
}
const vs=(a,b)=>{if(!times[a]||!times[b])return'';const d=times[a].t-times[b].t;return d>0.05?`${d.toFixed(1)} s faster than the ${a==='chaos'?'messy desk':'last round'}.`:`No faster than the ${a==='chaos'?'messy desk':'last round'}.`};

  for(let i=0;i<80;i++){const x=rnd(0,W),y=rnd(0,H),r=rnd(25,95),g=gctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(58,40,22,${rnd(.45,.85)})`);g.addColorStop(1,'rgba(58,40,22,0)');gctx.fillStyle=g;gctx.beginPath();gctx.arc(x,y,r,0,7);gctx.fill()}
  for(let i=0;i<5;i++){gctx.strokeStyle='rgba(70,40,18,.75)';gctx.lineWidth=rnd(4,7);gctx.beginPath();gctx.arc(rnd(80,920),rnd(80,560),rnd(26,40),0,7);gctx.stroke()}
  for(let i=0;i<1800;i++){gctx.fillStyle=Math.random()<.5?`rgba(205,195,170,${rnd(.3,.7)})`:`rgba(45,35,25,${rnd(.3,.7)})`;gctx.fillRect(rnd(0,W),rnd(0,H),2,2)}
  HAZ.forEach(h=>{const g=gctx.createRadialGradient(h.x,h.y,0,h.x,h.y,75);g.addColorStop(0,'rgba(48,32,18,.97)');g.addColorStop(.7,'rgba(48,32,18,.9)');g.addColorStop(1,'rgba(48,32,18,0)');gctx.fillStyle=g;gctx.beginPath();gctx.arc(h.x,h.y,75,0,7);gctx.fill()});
  grimeInit=countDirty();
}
function countDirty(){const d=gctx.getImageData(0,0,W,H).data;let n=0;for(let i=3;i<d.length;i+=32)if(d[i]>40)n++;return n}
function scrubLine(a,b){gctx.globalCompositeOperation='destination-out';gctx.lineCap='round';gctx.lineWidth=72;gctx.strokeStyle='#000';gctx.beginPath();gctx.moveTo(a.x,a.y);gctx.lineTo(b.x+.01,b.y);gctx.stroke()}
grime.addEventListener('pointerdown',e=>{if(mode!=='shine')return;e.preventDefault();scrub=deskPoint(e);try{grime.setPointerCapture(e.pointerId)}catch(_){}scrubLine(scrub,scrub)});
grime.addEventListener('pointermove',e=>{if(!scrub||mode!=='shine')return;const p=deskPoint(e);scrubLine(scrub,p);scrub=p;const now=performance.now();if(now-lastCheck>250){lastCheck=now;checkShine()}});
const endScrub=()=>{if(scrub){scrub=null;checkShine()}};
grime.addEventListener('pointerup',endScrub);grime.addEventListener('pointercancel',endScrub);
function checkShine(){
  const pct=Math.round(clamp(1-countDirty()/grimeInit,0,1)*100);
  HAZ.forEach((h,k)=>{if(shineFound.has(h.id))return;const d=gctx.getImageData(h.x-22,h.y-22,44,44).data;let a=0;for(let i=3;i<d.length;i+=4)a+=d[i];
    if(a/(d.length/4)<55){shineFound.add(h.id);ringHazard(h,k);toast(`Hazard found: ${h.title.toLowerCase()}.`)}});
  const n=$('#cleanN'),m=$('#cleanM');if(n)n.textContent=pct+'%';if(m)m.style.width=pct+'%';
  renderFinds();
  if(pct>=90&&shineFound.size===HAZ.length&&!shineFinished){shineFinished=true;setTimeout(shineDone,600)}
}
function ringHazard(h,k){const g=hazSvg.querySelector('#rings');g.insertAdjacentHTML('beforeend',`<circle cx="${h.x}" cy="${h.y}" r="38" fill="none" stroke="#f2c230" stroke-width="4" stroke-dasharray="8 5"/><rect x="${h.x+28}" y="${h.y-48}" width="22" height="22" rx="3" fill="#f2c230"/><text x="${h.x+39}" y="${h.y-32}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="14" fill="#151618">${k+1}</text>`)}
function renderFinds(){const f=$('#finds');if(!f)return;f.innerHTML=HAZ.map((h,k)=>shineFound.has(h.id)?`<li class="hit"><b>${k+1}. ${h.title}</b>${h.text}</li>`:`<li>${k+1}. Something is hiding under the dirt.</li>`).join('')}
function shineRound(){
  clearFound();setRail('shine');shineFound=new Set();shineFinished=false;
  drawHazards();makeGrime();setMode('shine');
  panel({eyebrow:'S3 · Seiso 清掃',title:'Shine',
    body:'<p>Organized, but filthy. Press and drag across the desk to scrub it clean.</p><p>Cleaning is also inspection. Two problems are hiding under the dirt.</p>',
    extra:`<div class="stat"><span class="n" id="cleanN">0%</span><span class="of">clean (aim for 90%)</span></div><div class="meter"><i id="cleanM"></i></div><ul class="finds" id="finds"></ul>`,
    ask:'Why is cleaning the moment you notice broken or dangerous things?',
    actions:[['Finish cleaning for me',()=>{gctx.clearRect(0,0,W,H);checkShine()},'ghost']]});
  renderFinds();
}
function shineDone(){
  setMode('idle');gctx.clearRect(0,0,W,H);
  panel({eyebrow:'S3 · Shine complete',title:'Clean, and safer',
    body:'<p>Two hazards caught before anyone got hurt. In a factory the same habit finds oil leaks, loose bolts and worn belts before they become breakdowns.</p>',
    ask:'Sort, Set in Order and Shine all worked. What happens on Monday when someone new sits here?',
    actions:[['Start S4: Standardize',standardRound]]});
}

/* ---------- S4 standardize ---------- */
const RULES=[
  {t:'Outline and label every home on the desk',good:true,why:'Anyone can see where things go, and spot what is missing.'},
  {t:'Everyone organizes the desk in their own way',good:false,why:'Then there is no standard. Each user undoes the last one.'},
  {t:'Post a photo of the correct desk next to it',good:true,why:'The photo is the standard. Nobody has to remember it.'},
  {t:'Clean up when it starts to look messy',good:false,why:'Too vague. "Messy" means something different to everyone.'},
  {t:'One slot per marker colour, labelled by colour',good:true,why:'Visual control. A missing colour is obvious at a glance.'},
  {t:'Just remember where things go',good:false,why:'Memory is not a standard. New users were never told.'},
  {t:'A 2-minute reset checklist at the end of every class',good:true,why:'Turns Sort, Set in Order and Shine into a routine.'}
];
let ruleSel=new Set(),locked=false;
function standardRound(){
  setRail('standard');hazSvg.innerHTML='';ruleSel=new Set();locked=false;setMode('idle');
  panel({eyebrow:'S4 · Seiketsu 清潔',title:'Standardize',
    body:'<p>The first three S worked once. A standard makes them the normal way of working for anyone who uses this desk.</p><p>Choose the rules that belong on this desk\'s standard, then lock it.</p>',
    extra:`<div class="opts" id="opts">${RULES.map((r,i)=>`<button type="button" class="opt" aria-pressed="false" data-i="${i}">${r.t}<span class="why"></span></button>`).join('')}</div><p id="stdMsg" class="body" style="margin:0"></p>`,
    ask:'What is the difference between a rule and a standard people can actually follow?',
    actions:[['Lock the standard',lockStandard]]});
  $('#opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||locked)return;const i=+b.dataset.i;ruleSel.has(i)?ruleSel.delete(i):ruleSel.add(i);b.setAttribute('aria-pressed',ruleSel.has(i));
    $('#opts').querySelectorAll('.opt').forEach(o=>{o.classList.remove('good','bad');o.querySelector('.why').textContent=''})});
}
function lockStandard(){
  let ok=true;
  $('#opts').querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i,r=RULES[i],on=ruleSel.has(i);
    o.classList.remove('good','bad');o.querySelector('.why').textContent='';
    if(on&&r.good){o.classList.add('good');o.querySelector('.why').textContent='✓ '+r.why}
    else if(on&&!r.good){ok=false;o.classList.add('bad');o.querySelector('.why').textContent='✗ '+r.why}
    else if(!on&&r.good){ok=false;o.classList.add('bad');o.querySelector('.why').textContent='Missing: '+r.why}});
  if(!ok){$('#stdMsg').textContent='Not yet. Read the notes, change your picks, and lock it again.';return}
  locked=true;
  panel({eyebrow:'S4 · Standardize complete',title:'The desk standard',
    extra:`<div class="poster"><h3>Desk standard · Room 5S</h3><ol>${RULES.filter(r=>r.good).map(r=>`<li>${r.t}</li>`).join('')}</ol><p class="sig">Applies to: everyone who uses this desk</p></div>`,
    body:'<p>Posted where everyone can see it. The desk now looks the same no matter who sat there last.</p>',
    ask:'A standard on the wall is only paper. What makes people actually follow it?',
    actions:[['Start S5: Sustain',sustainRound]]});
}

/* ---------- S5 sustain ---------- */
const MEASURES=[
  {k:'procedure',pillar:'Procedures',label:'Follow the 2-minute reset checklist at the end of class',desc:'A written, repeatable way to reset the desk.'},
  {k:'schedule',pillar:'Schedules',label:'Daily rota: one named student checks the desk',desc:'Someone owns it every day, so the checklist really happens.'},
  {k:'practice',pillar:'Practices',label:'Teach the standard to every new user on day one',desc:'Habits and training, so less mess is made in the first place.'},
  {k:'audit',pillar:'Audits',label:'Wednesday 5S audit with a posted score',desc:'A regular check that catches what slipped and shows the trend.'}
];
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
let choice={},nothing=false,week=null;
function resetToStandard(){
  clearFound();drawZones(true);hazSvg.innerHTML='';gctx.clearRect(0,0,W,H);
  items.filter(i=>!i.needed).forEach(removeItem);
  items.forEach((it,k)=>goHome(it,k));
}
function sustainRound(){
  setRail('sustain');resetToStandard();setMode('idle');choice={};nothing=false;week=null;times.sustain=null;renderBoard();
  panel({eyebrow:'S5 · Shitsuke 躾',title:'Sustain',
    extra:`<p class="big-q">"What stops tomorrow's student from destroying all our work?"</p>
      <p class="body" style="margin:0">Thirty other students use this desk this week. Discuss, choose what you will put in place, then run five school days.</p>
      <div class="opts" id="meas">${MEASURES.map(m=>`<button type="button" class="opt" aria-pressed="false" data-k="${m.k}">${m.label}</button>`).join('')}
      <button type="button" class="opt" aria-pressed="false" data-k="none">Nothing. The desk looks perfect already.</button></div>`,
    ask:'Which of these would your class actually keep doing in week 6?',
    actions:[['Run the week',runWeek]]});
  $('#meas').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;const k=b.dataset.k;
    if(k==='none'){nothing=!nothing;if(nothing)choice={}}else{choice[k]=!choice[k];if(choice[k])nothing=false}
    $('#meas').querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o.dataset.k==='none'?nothing:!!choice[o.dataset.k]))});
}
const deskScore=()=>{const j=items.filter(i=>!i.needed&&!i.dead).length,d=items.filter(i=>i.needed&&!i.placed).length;return{j,d,s:Math.max(0,Math.round(100-4*j-6*d))}};
function fix(frac){
  const junk=shuffle(items.filter(i=>!i.needed&&!i.dead)),nj=Math.floor(junk.length*frac);
  junk.slice(0,nj).forEach(it=>{it.dead=true;it.el.classList.add('gone');setTimeout(()=>removeItem(it),450)});
  const out=shuffle(items.filter(i=>i.needed&&!i.placed)),nd=Math.floor(out.length*frac);
  out.slice(0,nd).forEach(it=>goHome(it,items.indexOf(it)));
  return[nj,nd];
}
function chartSvg(scores){
  const bw=40,gap=16,h=100;
  return `<svg class="chart" viewBox="0 0 300 140" width="100%" role="img" aria-label="Daily 5S score">
    <line x1="0" y1="${10+h}" x2="300" y2="${10+h}" stroke="var(--line)"/>
    ${DAYS.map((d,i)=>{const s=scores[i];const x=10+i*(bw+gap+2);const bh=s==null?0:s/100*h;const c=s==null?'var(--panel2)':s>=80?'var(--green)':s>=50?'var(--yellow)':'var(--red)';
      return `<rect x="${x}" y="${10+h-bh}" width="${bw}" height="${bh}" fill="${c}" rx="2"/>${s!=null?`<text x="${x+bw/2}" y="${6+h-bh}" text-anchor="middle" font-size="11" style="fill:var(--ink)">${s}</text>`:''}<text x="${x+bw/2}" y="${h+26}" text-anchor="middle" font-size="11">${d}</text>`}).join('')}
  </svg>`;
}
function weekPanel(title,actions){
  panel({eyebrow:'S5 · Sustain · the week',title,
    extra:`<p class="eyebrow" style="color:var(--muted)">Daily desk score (100 = matches the standard)</p>${chartSvg(week.scores)}<ul class="simlog">${week.log.map((l,i)=>`<li><b>${DAYS[i]}</b><span>${l}</span></li>`).join('')}</ul>`,
    actions});
}
async function runWeek(){
  if(!nothing&&!Object.values(choice).some(Boolean)){toast('Choose at least one option, even "Nothing".');return}
  week={scores:[null,null,null,null,null],log:[]};
  weekPanel('Monday morning…',[]);
  for(let d=0;d<5;d++){
    const nj=choice.practice?2:5,nd=choice.practice?2:4;
    for(let k=0;k<nj;k++){const it=makeItem(pick(JUNK));const [x,y,r]=randomSpot();it.x=x;it.y=y;it.r=r;it.z=++zTop;place(it);setMode('idle');it.el.classList.add('pop')}
    shuffle(items.filter(i=>i.needed&&i.placed)).slice(0,nd).forEach(it=>{const [x,y,r]=randomSpot();it.placed=false;moveTo(it,x,y,r,++zTop)});
    let line=`${nj} things dumped, ${nd} items left out of place.`;
    week.log[d]=line;weekPanel(`${['Monday','Tuesday','Wednesday','Thursday','Friday'][d]}…`,[]);
    await sleep(900);
    const runs=choice.procedure&&(choice.schedule||d%2===1);
    if(runs){const [a,b]=fix(.75);line+=` Checklist done${choice.schedule?' by today\'s named student':''}: ${a} cleared, ${b} returned.`}
    else if(choice.procedure)line+=' Checklist skipped. Nobody was responsible today.';
    if(choice.audit&&d===2){fix(1);line+=' Audit: everything left behind fixed, score posted.'}
    week.scores[d]=deskScore().s;week.log[d]=line;
    weekPanel(`${['Monday','Tuesday','Wednesday','Thursday','Friday'][d]} done`,[]);
    await sleep(700);
  }
  const sc=deskScore();
  weekPanel(`Friday: score ${sc.s}`,[['Find the black marker on Friday',()=>searchRound('sustain',afterSustain)]]);
}
function afterSustain(){
  const chosen=MEASURES.filter(m=>choice[m.k]).length;
  panel({eyebrow:'S5 · the answer',title:'Why the fifth S is the hardest',
    extra:`<p class="result">${fmt(times.sustain)}<small>on Friday</small></p>
      <p class="big-q">"What stops tomorrow's student from destroying all our work?"</p>
      <div class="pillars">${MEASURES.map(m=>`<div class="pillar ${choice[m.k]?'on':''}"><b>${m.pillar}</b><span>${m.desc}</span><span class="st">${choice[m.k]?'You chose this':'Not chosen'}</span></div>`).join('')}</div>`,
    body:`<p>Sustain means procedures, schedules, practices and regular audits. The first four S are things you do once. Sustain is what you keep doing, every day, after the excitement is gone. ${chosen===4?'You used all four.':chosen===0?'With none of them, the desk slid back toward chaos in a week.':`You used ${chosen} of 4. Try the week again with a different mix.`}</p>`,
    ask:'Which of the four would be hardest to keep going in a real workplace? Why?',
    actions:[['See the results',results],['Rewind the week',sustainRound,'ghost']]});
}

/* ---------- results ---------- */
function results(){
  setRail('results');clearFound();setMode('idle');
  const c=times.chaos,o=times.order,f=times.sustain;
  const pct=(c&&o&&c.t>0)?Math.round((1-o.t/c.t)*100):null;
  panel({eyebrow:'Debrief',title:'What the clock showed',
    body:`<p>${pct!=null?`Sort plus Set in Order cut the search by <b>${pct}%</b>. `:''}${f?`On Friday it took <b>${fmt(f)}</b>. `:''}Shine found two hazards nobody had noticed, Standardize made the result the same for everyone, and Sustain decided whether it lasted.</p>
      <ul><li><b>Sort</b> (Seiri): remove what is not needed.</li><li><b>Set in Order</b> (Seiton): a home for everything.</li><li><b>Shine</b> (Seiso): clean, and inspect while you clean.</li><li><b>Standardize</b> (Seiketsu): make the right way the visible, normal way.</li><li><b>Sustain</b> (Shitsuke): procedures, schedules, practices, audits.</li></ul>`,
    ask:'Pick one place in your own life (bag, phone, kitchen, locker). Which S would help it most?',
    actions:[['Play again',intro],['Rerun the week',sustainRound,'ghost']]});
}

intro();
</script>
